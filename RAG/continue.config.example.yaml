## Continue.dev config.yaml — пример подключения MCP сервера kb-tools
## Скопируйте в ~/.continue/config.yaml

name: KB Tools MCP
version: 0.0.1
schema: v1
mcpServers:
  - name: kb-tools
    command: C:/dev/github.com/vadim-kosarev/tools/RAG/kb_tools_mcp_stdio.bat
    args: []
    env: {}

